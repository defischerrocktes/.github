name: Snake-Animation erzeugen

on:
  schedule:
    - cron: "17 3 * * *"   # täglich ~04:17 Uhr (Berlin)
  workflow_dispatch:        # manuell über den Actions-Tab startbar

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Snake aus dem Contribution-Graph erzeugen
        uses: Platane/snk@v3
        with:
          github_user_name: defischerrocktes
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF0000

      - name: In den Branch "output" schreiben
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
